# Include only inside the nginx TLS server for nasa.cartify.ink.
# Compress scripts, styles, data and SVG for the whole site. nginx compresses only HTML by
# default, which left the first load at about 1.1 MB; with this it is about a third of that.
gzip on;
gzip_types application/javascript text/css application/json image/svg+xml text/csv text/plain;
gzip_min_length 1024;
gzip_vary on;
# Security headers for every page and file of this vhost. HSTS covers this host only, not its
# sibling subdomains. The policy matches the one in the page: own scripts, styles, images and
# fonts, no inline script, no framing by other sites. The vhost itself already sends nosniff.
add_header Strict-Transport-Security "max-age=2592000" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
location = /api/ask {
    # Trust CF-Connecting-IP only from the published Cloudflare network.
    # https://www.cloudflare.com/ips/ (2026-11-14)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 8k;
    client_body_timeout 8s;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Access-Control-Allow-Origin "https://emilkadelaetsuuur.github.io" always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 2s;
    proxy_read_timeout 40s;
}
